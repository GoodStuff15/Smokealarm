stages:
  - stage: ApiTests
    displayName: 'SmokeAlarm API Tests'
    jobs:
      - job: RunPowerShellTests
        displayName: 'PowerShell API Test Suite'
        pool:
          vmImage: 'windows-latest'

        steps:
          - checkout: self

          - task: PowerShell@2
            displayName: 'Run API Test Suite'
            inputs:
              filePath: '$(System.DefaultWorkingDirectory)/TestRunner.ps1'
              arguments: >
                -openApiSpecPath "$(System.DefaultWorkingDirectory)/swagger.json"
                -baseUrl "$(API_BASE_URL)"
                -accessToken "$(API_ACCESS_TOKEN)"
                -failOnTestFailures $(FAIL_ON_TEST_FAILURES)
                -skipPaths "$(SKIP_PATHS)"
                -methods $(METHODS)
                -showDetailedErrors $(SHOW_DETAILED_ERRORS)
                -saveReports $(SAVE_REPORTS)
                -reportLocation "$(System.DefaultWorkingDirectory)/TestReports"
                -maxReports $(MAX_REPORTS)
                -maxAgeDays $(MAX_AGE_DAYS)
              pwsh: true

        variables:
          FAIL_ON_TEST_FAILURES: true
          SKIP_PATHS: 'auth,admin'       # comma separated, empty to skip nothing
          METHODS: "'get','post','put','delete'"        # quote-wrapped for PS array
          SHOW_DETAILED_ERRORS: false
          SAVE_REPORTS: true
          MAX_REPORTS: 10
          MAX_AGE_DAYS: 10